[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-vision-studio"
version = "4.3.0"
description = "Modular Industrial Machine Vision Platform & Visual Flow Orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Apex Vision Technologies" }
]
keywords = [
    "machine-vision",
    "computer-vision",
    "pyqt6",
    "opencv",
    "industrial-automation",
    "hikrobot",
    "flow-editor",
    "mvs",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "PyQt6>=6.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "anthropic>=0.86.0",     # AI Gen (Claude); other providers use plain HTTP
]

[project.optional-dependencies]
ml = [
    "ultralytics>=8.0.0",
]
ai = [
    "keyring>=24.0.0",      # remember API keys in the OS credential store
    "mcp>=1.2.0",           # python main.py --mcp
]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pyinstaller>=6.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
apex-vision = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apex_vision*"]

[tool.setuptools.package-data]
apex_vision = ["assets/*", "flowgen/reference/*.md", "flowgen/recipes/*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
