name: Build & Release Desktop Application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Distribution
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run verification test suite
      run: |
        python -m pytest tests/ -q

    - name: Build standalone app with PyInstaller
      run: |
        pyinstaller ApexVisionStudio.spec --clean --noconfirm

    - name: Create standalone ZIP bundle
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $zipName = "ApexVisionStudio-${tag}-Windows-x64.zip"
        Compress-Archive -Path "dist/ApexVisionStudio/*" -DestinationPath $zipName
        Write-Host "Created archive: $zipName"

    - name: Compile Inno Setup Windows Installer
      uses: EssaHaji/actions-inno-setup@v1.0.1
      with:
        filepath: 'installer_setup.iss'

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ApexVisionStudio-*-Windows-x64.zip
          installer_output/*.exe
        body_path: docs/RELEASE_NOTES_v1.0.0-beta.1.md
        draft: false
        prerelease: true
