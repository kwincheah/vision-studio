name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Linux system dependencies (headless Qt6)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Scan repository for secrets
      run: |
        python scripts/check_secrets.py

    - name: Run automated test suite (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pytest tests/ -v

    - name: Run automated test suite (Linux Headless)
      if: runner.os == 'Linux'
      run: |
        xvfb-run -a python -m pytest tests/ -v
